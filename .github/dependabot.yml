version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      toolchain:
        patterns: ['vite', '@vitejs/*', 'typescript', 'vitest', '@playwright/*', 'tailwindcss', '@tailwindcss/*']
      app:
        patterns: ['*']
        exclude-patterns: ['react', 'react-dom', '@types/*', 'vite*', '@vitejs/*', 'typescript', 'vitest', '@playwright/*', 'tailwind*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
